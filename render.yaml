services:
  - type: web
    name: salon-queue-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: STAFF_PIN
        value: "1234"
      - key: MONGO_URI
        sync: false
